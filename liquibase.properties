# Local defaults for the Liquibase CLI. CI passes everything explicitly.
#
# Connection details are NOT stored here. Export them before running:
#   LIQUIBASE_COMMAND_URL        = jdbc:mysql://localhost:3307/demo
#   LIQUIBASE_COMMAND_USERNAME   = demo
#   LIQUIBASE_COMMAND_PASSWORD   = demo
#
# Liquibase does not ship the MySQL JDBC driver (GPL). Download
# mysql-connector-j from Maven Central and point Liquibase at it:
#   LIQUIBASE_CLASSPATH          = /path/to/mysql-connector-j-9.7.0.jar
#
# Personal overrides go in liquibase.properties.local (git-ignored):
#   liquibase --defaults-file=liquibase.properties.local update

changelogFile=changelog.yaml
logLevel=info
