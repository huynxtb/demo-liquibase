# Local MySQL for demo: docker compose up -d
services:
  mysql:
    image: mysql:8.4
    container_name: demo-liquibase-mysql
    environment:
      MYSQL_DATABASE: demo
      MYSQL_USER: demo
      MYSQL_PASSWORD: demo
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "${MYSQL_PORT:-3307}:3306"   # host port, override with MYSQL_PORT=3306
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-udemo", "-pdemo"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysqldata:
