name: Migrate database

# Branch = environment. A push to one of these branches migrates its database:
#   dev  -> GitHub Environment "dev"  (schema dev)
#   uat  -> GitHub Environment "uat"  (schema uat)
#   main -> GitHub Environment "prd"  (schema prd)
# Promotion is done by merging dev -> uat -> main.
#
# "Run workflow" on a branch re-runs the migration for that branch's environment;
# fill in rollback_tag to roll that environment back to a Liquibase tag instead.

on:
  push:
    branches: [dev, uat, main]
    paths:
      - changelog.yaml
      - "changes/**"
      - .github/workflows/migrate.yml
      - .github/workflows/run-migration.yml
  workflow_dispatch:
    inputs:
      rollback_tag:
        description: "Leave empty to update. Set a Liquibase tag (e.g. release-1.0.1) to roll back to it."
        required: false
        type: string
        default: ""

permissions:
  contents: read

# One migration at a time per branch/environment; never cancel a running one.
concurrency:
  group: liquibase-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  migrate:
    uses: ./.github/workflows/run-migration.yml
    with:
      # main -> prd, any other branch -> same-named environment (dev, uat).
      environment: ${{ github.ref_name == 'main' && 'prd' || github.ref_name }}
      rollback_tag: ${{ inputs.rollback_tag || '' }}
    secrets: inherit
